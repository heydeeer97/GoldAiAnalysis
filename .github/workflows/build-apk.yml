
name: Build Gold AI Analyst APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="GoldAIAnalyst_Android_Starter.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Android project ZIP not found!"
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Apply MainActivity and Manifest
        shell: bash
        run: |
          set -e

          MAIN=$(find project -type f -name "MainActivity.kt" | head -n 1)
          MANIFEST=$(find project -type f -path "*/src/main/AndroidManifest.xml" | head -n 1)

          if [ -z "$MAIN" ] || [ -z "$MANIFEST" ]; then
            echo "Android source files not found!"
            exit 1
          fi

          if [ ! -f "overrides/MainActivity.kt" ]; then
            echo "MainActivity override not found!"
            exit 1
          fi

          if [ ! -f "overrides/AndroidManifest.xml" ]; then
            echo "Manifest override not found!"
            exit 1
          fi

          cp overrides/MainActivity.kt "$MAIN"
          cp overrides/AndroidManifest.xml "$MANIFEST"

      - name: Install Gold AI Launcher Icons
        shell: bash
        run: |
          set -e

          ICON_ZIP="GoldAI_Launcher_Icons.zip"

          if [ ! -f "$ICON_ZIP" ]; then
            echo "Launcher icons ZIP not found!"
            exit 1
          fi

          mkdir -p icon_package
          unzip -q "$ICON_ZIP" -d icon_package

          RES_SOURCE="icon_package/overrides/res"

          if [ ! -d "$RES_SOURCE" ]; then
            echo "Icon resources not found!"
            exit 1
          fi

          RES_TARGET=$(find project -type d -path "*/src/main/res" | head -n 1)

          if [ -z "$RES_TARGET" ]; then
            echo "Android res directory not found!"
            exit 1
          fi

          cp -R "$RES_SOURCE"/mipmap-* "$RES_TARGET"/

          test -f "$RES_TARGET/mipmap-mdpi/ic_launcher.png"
          test -f "$RES_TARGET/mipmap-xxxhdpi/ic_launcher.png"

          echo "Gold AI Analyst icons installed successfully!"

      - name: Build APK
        shell: bash
        run: |
          set -e

          GRADLE=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$GRADLE" ]; then
            echo "Gradle wrapper not found!"
            exit 1
          fi

          cd "$(dirname "$GRADLE")"

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-AI-Analyst-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

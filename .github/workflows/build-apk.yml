
name: Build Gold AI Analyst APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools,platforms;android-35,build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          test -f GoldAIAnalyst_Android_Starter.zip

          mkdir -p project
          unzip -q GoldAIAnalyst_Android_Starter.zip -d project

          SETTINGS=$(find project -type f \
            -name settings.gradle.kts | head -n 1)

          test -n "$SETTINGS"

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Apply MainActivity override
        shell: bash
        run: |
          set -e

          if [ -f overrides/MainActivity.kt ]; then
            MAIN=$(find "$PROJECT_DIR/app/src/main" \
              -type f -name MainActivity.kt | head -n 1)

            if [ -n "$MAIN" ]; then
              cp overrides/MainActivity.kt "$MAIN"
            fi
          fi

      - name: Install Gold AI Launcher Icons
        shell: bash
        run: |
          set -e

          test -f GoldAI_Launcher_Icons.zip

          mkdir -p icon_package
          unzip -q GoldAI_Launcher_Icons.zip -d icon_package

          RES_SOURCE="icon_package/overrides/res"
          RES_TARGET="$PROJECT_DIR/app/src/main/res"

          test -d "$RES_SOURCE"
          mkdir -p "$RES_TARGET"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            SOURCE="$RES_SOURCE/mipmap-$density"
            TARGET="$RES_TARGET/mipmap-$density"

            test -s "$SOURCE/ic_launcher.png"
            test -s "$SOURCE/ic_launcher_round.png"

            mkdir -p "$TARGET"

            cp "$SOURCE/ic_launcher.png" "$TARGET/"
            cp "$SOURCE/ic_launcher_round.png" "$TARGET/"
          done

          echo "All 10 icons installed!"

      - name: Configure Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          ET.register_namespace(
              "android",
              "http://schemas.android.com/apk/res/android"
          )

          tree = ET.parse(path)
          root = tree.getroot()

          ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")

          if app is None:
              raise SystemExit("Application tag not found")

          app.set(ns + "icon", "@mipmap/ic_launcher")
          app.set(ns + "roundIcon", "@mipmap/ic_launcher_round")
          app.set(ns + "label", "Gold AI Analyst")

          ET.indent(tree, space="    ")
          tree.write(path, encoding="utf-8", xml_declaration=True)

          print("Manifest configured!")
          PY

      - name: Verify Android resources
        shell: bash
        run: |
          set -e

          RES="$PROJECT_DIR/app/src/main/res"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            test -s "$RES/mipmap-$density/ic_launcher.png"
            test -s "$RES/mipmap-$density/ic_launcher_round.png"
          done

          echo "Resources verified!"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle --version

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-AI-Analyst-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7


name: Build Gold AI Analyst APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="GoldAIAnalyst_Android_Starter.zip"

          test -f "$ZIP_FILE" || {
            echo "Android project ZIP not found!"
            exit 1
          }

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "Android project extracted!"

      - name: Apply MainActivity and Manifest
        shell: bash
        run: |
          set -e

          MAIN=$(find project -type f \
            -name "MainActivity.kt" | head -n 1)

          MANIFEST=$(find project -type f \
            -path "*/src/main/AndroidManifest.xml" | head -n 1)

          test -n "$MAIN" || {
            echo "MainActivity.kt not found!"
            exit 1
          }

          test -n "$MANIFEST" || {
            echo "AndroidManifest.xml not found!"
            exit 1
          }

          test -f overrides/MainActivity.kt
          test -f overrides/AndroidManifest.xml

          cp overrides/MainActivity.kt "$MAIN"
          cp overrides/AndroidManifest.xml "$MANIFEST"

          echo "Source files updated!"

      - name: Install Gold AI Launcher Icons
        shell: bash
        run: |
          set -e

          ICON_ZIP="GoldAI_Launcher_Icons.zip"

          test -f "$ICON_ZIP" || {
            echo "Icons ZIP not found!"
            exit 1
          }

          mkdir -p icon_package
          unzip -q "$ICON_ZIP" -d icon_package

          RES_SOURCE="icon_package/overrides/res"

          test -d "$RES_SOURCE" || {
            echo "Icon resources not found!"
            exit 1
          }

          MANIFEST=$(find project -type f \
            -path "*/src/main/AndroidManifest.xml" | head -n 1)

          test -n "$MANIFEST" || {
            echo "Manifest not found!"
            exit 1
          }

          RES_TARGET="$(dirname "$MANIFEST")/res"

          mkdir -p "$RES_TARGET"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            SOURCE="$RES_SOURCE/mipmap-$density"
            TARGET="$RES_TARGET/mipmap-$density"

            mkdir -p "$TARGET"

            cp "$SOURCE/ic_launcher.png" "$TARGET/"
            cp "$SOURCE/ic_launcher_round.png" "$TARGET/"
          done

          echo "All 10 icons installed!"

      - name: Verify Android resources
        shell: bash
        run: |
          set -e

          MANIFEST=$(find project -type f \
            -path "*/src/main/AndroidManifest.xml" | head -n 1)

          RES="$(dirname "$MANIFEST")/res"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            test -s "$RES/mipmap-$density/ic_launcher.png"
            test -s "$RES/mipmap-$density/ic_launcher_round.png"
          done

          echo "All launcher icons verified!"

      - name: Build APK
        shell: bash
        run: |
          set -e

          GRADLE=$(find project -type f \
            -name gradlew | head -n 1)

          test -n "$GRADLE" || {
            echo "Gradle wrapper not found!"
            exit 1
          }

          cd "$(dirname "$GRADLE")"

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-AI-Analyst-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

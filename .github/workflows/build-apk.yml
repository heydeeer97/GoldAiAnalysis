
name: Build Gold AI Analyst APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q GoldAIAnalyst_Android_Starter.zip

      - name: Apply updated Android files
        run: |
          cp overrides/MainActivity.kt GoldAIAnalyst/app/src/main/java/com/goldai/analyst/MainActivity.kt
          cp overrides/AndroidManifest.xml GoldAIAnalyst/app/src/main/AndroidManifest.xml

      - name: Fix JVM compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("GoldAIAnalyst/app/build.gradle.kts")
          s = p.read_text()

          patch = '''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          '''

          if 'jvmTarget' not in s:
              s = s.replace(
                  '    compileSdk = 35',
                  '    compileSdk = 35\n' + patch
              )
              p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd GoldAIAnalyst
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-AI-Analyst-APK
          path: GoldAIAnalyst/app/build/outputs/apk/debug/app-debug.apk
